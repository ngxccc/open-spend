changelog:
  exclude:
    labels:
      - "ignore"
      - "type:chore"
      - "wontfix"
    authors:
      - "dependabot[bot]"
  categories:
    - title: "Features"
      labels:
        - "type:feat"
        - "enhancement"
        - "feature"
        - "feat"
    - title: "Bug Fixes"
      labels:
        - "type:fix"
        - "bug"
        - "fix"
    - title: "Performance"
      labels:
        - "type:perf"
    - title: "Refactoring"
      labels:
        - "type:refactor"
        - "changed"
    - title: "Testing"
      labels:
        - "type:test"
    - title: "Documentation"
      labels:
        - "type:docs"
        - "documentation"
    - title: "Maintenance & CI"
      labels:
        - "type:ci"
        - "type:style"
        - "ci"
        - "dependencies"
