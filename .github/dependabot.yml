version: 2
updates:
  # ── Bun / JavaScript & Mobile dependencies ──
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    # ── Ignore packages strictly pinned by Expo SDK, React Native runtime & NativeWind v5 ──
    # These must NOT be bumped independently by bots; upgrades are handled via `npx expo upgrade`.
    ignore:
      # 1. Expo ecosystem
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"

      # 2. React Native core & bundled native modules
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"

      # 3. NativeWind v5 & Tailwind CSS (prevents npm tag 'latest' downgrade to v4 and parser breakages)
      - dependency-name: "nativewind"
      - dependency-name: "react-native-css"
      - dependency-name: "tailwindcss"
      - dependency-name: "@tailwindcss/*"
      - dependency-name: "lightningcss"

      # 4. Dev tools with high breaking change risk
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

    groups:
      security-updates:
        patterns: ["*"]
        update-types: ["patch"]
        applies-to: "security-updates"
      safe-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions workflows ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
