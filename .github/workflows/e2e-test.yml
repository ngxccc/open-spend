name: Android E2E Tests

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/e2e-test.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/e2e-test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Maestro E2E on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Setup Android Environment
        uses: ./.github/setup-android
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prebuild Native Android Project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean

      # Build standalone Release APK targeting ONLY x86_64 architecture for CI runner.
      # Release mode ensures the Hermes JS bundle & assets are packaged standalone inside the APK.
      # Single-ABI (x86_64) cuts compilation time by >50% compared to universal builds.
      - name: Compile Standalone APK (x86_64 Single-ABI)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            --build-cache \
            --no-daemon

      # Hardware acceleration setup for fast Linux KVM runner
      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Maestro CLI
        uses: ./.github/cache
        id: maestro-cache
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro-cli

      - name: Install Maestro CLI
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # Cache AVD Snapshot to allow near-instant emulator boot (~15s)
      - name: Cache AVD Snapshot
        uses: ./.github/cache
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-31-x86_64-v1

      - name: Run Maestro E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -noaudio -no-boot-anim
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro/
