name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    name: Check version and tag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version_check.outputs.should_build }}
      is_new_version: ${{ steps.version_check.outputs.is_new_version }}
      tag: ${{ steps.version_check.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check package.json version
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version apps/mobile/package.json)
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Only check for official release and bump release flags if on main branch
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Building from non-main branch (${{ github.ref }}): skipping release creation."
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists on GitHub."
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Manual trigger on main: proceeding to build without creating release."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "No new version: skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New release target detected on main: $TAG"
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Android APK
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild native Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro/
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: open-spend-${{ needs.check-version.outputs.tag || 'apk' }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Tag and Create GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main' && needs.check-version.outputs.should_build == 'true' && needs.check-version.outputs.is_new_version == 'true'
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check-version.outputs.tag }}"
          mv app-release.apk "openspend-${TAG}.apk" || true
          sha256sum "openspend-${TAG}.apk" > SHA256SUMS.txt

          # Atomically tag commit only after successful build and test
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

          if [ "${{ needs.check-version.outputs.is_new_version }}" = "true" ]; then
            gh release create "$TAG" \
              "openspend-${TAG}.apk" \
              SHA256SUMS.txt \
              --title "OpenSpend $TAG" \
              --generate-notes
            gh release upload "$TAG" "openspend-${TAG}.apk" SHA256SUMS.txt --clobber
          fi
