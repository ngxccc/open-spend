appId: com.openspend.app
---
- launchApp
- assertVisible: "OpenSpend"
- assertVisible: "Chào mừng trở lại"
- assertVisible: "Email"
- assertVisible: "Mật khẩu"
- assertVisible: "Đăng nhập"

# Test form validation error when submitting empty fields
- tapOn: "Đăng nhập"
- assertVisible: "Vui lòng nhập địa chỉ email"
- assertVisible: "Vui lòng nhập mật khẩu"

# Test Guest Mode Toast triggering and ensure toast text displays
- tapOn: "Tiếp tục với Chế độ Khách"
- assertVisible: "Đang kích hoạt Chế độ Khách..."

# Navigate to Register screen
- tapOn: "Tạo tài khoản mới"
- assertVisible: "Tạo tài khoản"
- assertVisible: "Họ và tên"
- assertVisible: "Xác nhận mật khẩu"
